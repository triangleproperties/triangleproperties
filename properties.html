<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ongoing Projects & Plot Layout Listings | Triangle Properties</title>
  <meta name="description" content="Browse ongoing DTCP & RERA approved projects including Susee Alight Kuthambakkam, M.A. Nagar Kadambathur, and Ishwarya Nagar ECR with EMI options." />
  <link rel="canonical" href="https://triangleproperties.in/properties.html" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <meta property="og:title" content="Ongoing Projects & Plot Layout Listings | Triangle Properties" />
  <meta property="og:description" content="Explore approved plots with EMI options starting at ₹6,000/month." />
  <meta property="og:url" content="https://triangleproperties.in/properties.html" />
  <meta property="og:image" content="https://triangleproperties.in/assets/logo.png" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC NAVBAR CONTAINER (Loaded from components/navbar.html) -->
  <div id="navbar-container"></div>
  <script src="js/navbar-loader.js"></script>

  <!-- BANNER -->
  <section id="collections" class="py-10 sm:py-16 px-4 md:px-16 max-w-[1440px] mx-auto text-center border-b border-slate-200 dark:border-slate-800">
    <h1 id="project-banner-heading" class="font-display text-3xl sm:text-6xl font-light mb-4">ONGOING PROJECTS</h1>
    <p id="project-banner-subheading" class="font-body text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-2xl mx-auto leading-relaxed">
      From affordable residential plots to premium gated communities, our ongoing projects are designed to deliver exceptional value and long-term appreciation.
    </p>
  </section>

  <!-- FILTER CONTROLS & PROPERTIES GRID -->
  <main class="py-8 sm:py-12 px-4 md:px-16 max-w-[1440px] mx-auto flex-grow w-full space-y-8">
    
    <!-- LUXURY FILTER BAR -->
    <div class="glass-card p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 dark:border-slate-800 shadow-lg space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <!-- Search Keyword -->
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
          <input type="text" id="search-keyword" placeholder="Search by layout name or location..."
                 class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-semibold focus:outline-none focus:border-amber-500 transition-all text-slate-900 dark:text-white" />
        </div>

        <!-- Project Status Filter -->
        <div class="relative">
          <select id="filter-status"
                  class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-semibold focus:outline-none focus:border-amber-500 transition-all text-slate-900 dark:text-white appearance-none cursor-pointer">
            <option value="ALL">All Project Status</option>
            <option value="ONGOING">Ongoing Projects</option>
            <option value="COMPLETED">Completed Projects</option>
          </select>
          <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">expand_more</span>
        </div>

        <!-- Category / Approval Type -->
        <div class="relative">
          <select id="filter-type"
                  class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-semibold focus:outline-none focus:border-amber-500 transition-all text-slate-900 dark:text-white appearance-none cursor-pointer">
            <option value="ALL">All Approval Categories</option>
            <option value="DTCP & RERA Approved Plot">DTCP & RERA Approved</option>
            <option value="DTCP Approved Plot">DTCP Approved</option>
            <option value="CMDA Approved Plots">CMDA Approved</option>
            <option value="CMDA & RERA Approved Layout">CMDA & RERA Layout</option>
          </select>
          <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">expand_more</span>
        </div>

        <!-- Max Price Filter -->
        <div class="relative">
          <select id="filter-price"
                  class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-semibold focus:outline-none focus:border-amber-500 transition-all text-slate-900 dark:text-white appearance-none cursor-pointer">
            <option value="9999999999">All Price Ranges</option>
            <option value="1000">Under ₹1,000 / sq.ft</option>
            <option value="2000">Under ₹2,000 / sq.ft</option>
            <option value="3000">Under ₹3,000 / sq.ft</option>
          </select>
          <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">expand_more</span>
        </div>
      </div>
    </div>

    <!-- PROPERTIES GRID -->
    <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/properties.js"></script>
</body>
</html>
