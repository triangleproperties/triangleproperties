<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Architectural Gallery | Triangle Properties</title>
  <meta name="description" content="Explore high-resolution photographs of Triangle Properties completed developments, elevation concepts, structural construction progress, and luxury interiors in Vadapalani & Chennai."/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC COMPONENTS CONTAINERS -->
  <div id="navbar-container"></div>

  <!-- BANNER -->
  <section class="py-12 sm:py-20 px-4 md:px-16 max-w-[1440px] mx-auto text-center border-b border-slate-200 dark:border-slate-800">
    <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">Visual Heritage</span>
    <h1 class="font-display text-3xl sm:text-6xl font-light mb-4">Architectural Gallery</h1>
    <p class="font-body text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-xl mx-auto">
      Explore high-resolution photography showcasing completed developments, luxury interior design, and civil engineering progress across Chennai.
    </p>
  </section>

  <!-- GALLERY CATEGORY FILTER BUTTONS -->
  <section class="py-6 sm:py-8 px-4 md:px-16 max-w-[1440px] mx-auto">
    <div class="flex flex-wrap justify-center gap-2 sm:gap-3 font-button text-xs uppercase tracking-widest">
      <button class="gallery-filter-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full bg-amber-500 text-slate-950 font-bold shadow-md" data-filter="ALL">All Photos</button>
      <button class="gallery-filter-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-amber-500" data-filter="Elevation">Elevations</button>
      <button class="gallery-filter-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-amber-500" data-filter="Interior">Interiors</button>
      <button class="gallery-filter-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-amber-500" data-filter="Construction">Construction</button>
      <button class="gallery-filter-btn px-4 sm:px-6 py-2 sm:py-2.5 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-amber-500" data-filter="Completed">Completed</button>
    </div>
  </section>

  <!-- GALLERY PHOTO GRID -->
  <main class="py-8 sm:py-12 px-4 md:px-16 max-w-[1440px] mx-auto flex-grow">
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- Populated via JavaScript -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderGallery('ALL');
      initGalleryFilters();

      // Listen for Live Admin Storage Updates across tabs
      window.addEventListener('storage', (e) => {
        if (e.key === 'triangle_custom_data') {
          renderGallery('ALL');
        }
      });
    });

    function renderGallery(filterCategory) {
      const grid = document.getElementById('gallery-grid');
      const liveData = window.loadLiveTriangleData ? window.loadLiveTriangleData() : window.TRIANGLE_DATA;
      const items = liveData?.gallery || [];
      const filtered = filterCategory === 'ALL' ? items : items.filter(item => item.category === filterCategory);

      grid.innerHTML = filtered.map(item => `
        <div class="glass-card rounded-2xl overflow-hidden group">
          <div class="aspect-[4/3] overflow-hidden relative">
            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy">
            <div class="absolute top-4 left-4 bg-slate-950/80 text-amber-400 font-button text-[10px] uppercase px-3 py-1 rounded-full border border-amber-500/30">
              ${item.category}
            </div>
          </div>
          <div class="p-4 sm:p-6">
            <h3 class="font-display text-lg sm:text-xl font-bold mb-1">${item.title}</h3>
          </div>
        </div>
      `).join('');
    }

    function initGalleryFilters() {
      const buttons = document.querySelectorAll('.gallery-filter-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
            b.classList.add('bg-slate-100', 'dark:bg-slate-900', 'border', 'border-slate-300', 'dark:border-slate-800');
          });
          btn.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');
          renderGallery(btn.getAttribute('data-filter'));
        });
      });
    }
  </script>
</body>
</html>
