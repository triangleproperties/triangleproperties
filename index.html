<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <script>
    (function () {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triangle Properties | Chennai's Most Affordable Luxury Developer</title>
  <meta name="description"
    content="Triangle Properties - TAP into Smart Investments. Experience uncompromised architectural excellence in Vadapalani & Chennai." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "RealEstateAgent",
    "name": "Triangle Properties",
    "image": "assets/logo.png",
    "telephone": "+91 88389 57874",
    "email": "info@triangleproperties.in",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "No.23, Pillaiyar Kovil Street, Vadapalani",
      "addressLocality": "Chennai",
      "addressRegion": "Tamil Nadu",
      "postalCode": "600026",
      "addressCountry": "IN"
    },
    "priceRange": "₹36 Lakhs - ₹3.4 Cr"
  }
  </script>
</head>

<body
  class="bg-slate-50 dark:bg-[#16130B] text-slate-900 dark:text-[#EAE1D4] font-body selection:bg-amber-500/30 min-h-screen flex flex-col overflow-x-hidden transition-colors duration-300">

  <!-- DYNAMIC NAVBAR CONTAINER (Loaded from components/navbar.html) -->
  <div id="navbar-container"></div>

  <main class="flex-grow">
    <!-- EXECUTIVE HERO SLIDER (CLEAN BANNER DISPLAY) -->
    <section class="relative w-full overflow-hidden border-b border-slate-200 dark:border-slate-800 bg-slate-950">
      
      <!-- HERO CAROUSEL SLIDES (100% CLEAN IMAGE QUALITY, NO OVERLAYS OR BLUR) -->
      <div id="hero-carousel" class="relative w-full aspect-[16/9] sm:aspect-[2.2/1] min-h-[220px] sm:min-h-[480px]">
        <!-- Slide 1: Susee Alight Kuthambakkam -->
        <div
          class="hero-slide absolute inset-0 transition-opacity duration-700 ease-in-out opacity-100 bg-contain sm:bg-cover bg-center bg-no-repeat"
          style="background-image: url('assets/hero-slider-1.jpg');">
        </div>
        <!-- Slide 2: ECR Resort Plots -->
        <div
          class="hero-slide absolute inset-0 transition-opacity duration-700 ease-in-out opacity-0 bg-contain sm:bg-cover bg-center bg-no-repeat"
          style="background-image: url('assets/hero-slider-2.jpg');">
        </div>
        <!-- Slide 3: M.A. Nagar Tiruvallur -->
        <div
          class="hero-slide absolute inset-0 transition-opacity duration-700 ease-in-out opacity-0 bg-contain sm:bg-cover bg-center bg-no-repeat"
          style="background-image: url('assets/hero-slider-3.jpg');">
        </div>

        <!-- FLOATING CAROUSEL CONTROLS & INDICATORS -->
        <div class="absolute bottom-3 right-3 sm:bottom-6 sm:right-8 z-20 flex items-center gap-3 bg-slate-950/80 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-800 shadow-2xl">
          <button id="hero-prev-btn" aria-label="Previous Slide"
            class="p-1 rounded-full text-slate-300 hover:text-amber-400 transition-all">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
          </button>
          <div id="hero-indicators" class="flex items-center gap-2">
            <button class="w-6 h-1.5 rounded-full bg-amber-500 transition-all hero-indicator" data-slide="0"></button>
            <button class="w-2 h-1.5 rounded-full bg-slate-600 transition-all hero-indicator" data-slide="1"></button>
            <button class="w-2 h-1.5 rounded-full bg-slate-600 transition-all hero-indicator" data-slide="2"></button>
          </div>
          <button id="hero-next-btn" aria-label="Next Slide"
            class="p-1 rounded-full text-slate-300 hover:text-amber-400 transition-all">
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </div>
      </div>
    </section>

    <!-- SINGLE LINE STATS BAR -->
    <section class="py-6 sm:py-8 bg-slate-100 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-900">
      <div
        class="max-w-[1440px] mx-auto px-4 md:px-16 flex flex-wrap items-center justify-around gap-4 sm:gap-8 text-center font-button text-xs sm:text-sm font-bold tracking-widest text-slate-800 dark:text-slate-200">
        <div class="flex items-center gap-2">
          <span class="stat-counter font-display text-2xl sm:text-4xl text-amber-500" data-target="5"
            data-suffix="+">0+</span>
          <span>YEARS EXPERIENCE</span>
        </div>
        <div class="hidden sm:block text-slate-300 dark:text-slate-800">•</div>
        <div class="flex items-center gap-2">
          <span class="stat-counter font-display text-2xl sm:text-4xl text-amber-500" data-target="10"
            data-suffix="+">0+</span>
          <span>PROJECTS HANDED OVER</span>
        </div>
        <div class="hidden sm:block text-slate-300 dark:text-slate-800">•</div>
        <div class="flex items-center gap-2">
          <span class="stat-counter font-display text-2xl sm:text-4xl text-amber-500" data-target="1000"
            data-suffix="+">0+</span>
          <span>HAPPY CUSTOMERS</span>
        </div>
      </div>
    </section>

    <!-- OUR ONGOING PROJECTS GRID -->
    <section id="collections" class="py-16 sm:py-24 px-4 md:px-16 max-w-[1440px] mx-auto">
      <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 sm:mb-16">
        <div>
          <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">100% Legal Clear
            Layouts</span>
          <h2 class="font-display text-3xl sm:text-5xl font-light">OUR ONGOING PROJECTS</h2>
        </div>
        <a href="properties.html"
          class="mt-4 md:mt-0 font-button text-xs text-amber-500 uppercase tracking-widest hover:underline flex items-center gap-2 font-bold">
          <span>View All Ongoing Projects</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
      </div>

      <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- REAL GOOGLE REVIEWS SECTION -->
    <section class="py-24 bg-slate-50 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800">
      <div class="max-w-[1440px] mx-auto px-4 md:px-16">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12">
          <div>
            <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">Verified Client
              Experiences</span>
            <h2 class="font-display text-3xl sm:text-5xl font-light">What Our Clients Say</h2>
          </div>
          <div class="mt-4 md:mt-0 flex items-center gap-3">
            <a href="https://www.google.com/search?q=trianglepropertiespvt+google+reviews" target="_blank"
              rel="noopener noreferrer"
              class="font-button text-xs text-amber-500 uppercase tracking-widest hover:underline flex items-center gap-1 font-bold mr-2 hidden sm:flex">
              <span>50+ Google Reviews</span>
              <span class="material-symbols-outlined text-sm">open_in_new</span>
            </a>
            <button id="testimonial-prev-btn" type="button" aria-label="Previous Testimonial"
              class="p-3 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-amber-500 hover:text-slate-950 transition-all focus:outline-none shadow-md">
              <span class="material-symbols-outlined text-xl">arrow_back</span>
            </button>
            <button id="testimonial-next-btn" type="button" aria-label="Next Testimonial"
              class="p-3 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-amber-500 hover:text-slate-950 transition-all focus:outline-none shadow-md">
              <span class="material-symbols-outlined text-xl">arrow_forward</span>
            </button>
          </div>
        </div>

        <div id="testimonials-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 transition-all duration-500">
          <!-- Rendered dynamically by initTestimonialsSlider() -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/properties.js"></script>
</body>

</html>
