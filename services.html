<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Services | Triangle Properties Pvt. Ltd.</title>
  <meta name="description" content="Explore end-to-end real estate plot sales, turnkey house construction, joint venture land development, and legal title management in Vadapalani & Chennai."/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC NAVBAR CONTAINER (Loaded from components/navbar.html) -->
  <div id="navbar-container"></div>
  <script src="js/navbar-loader.js"></script>

  <!-- BANNER -->
  <section class="py-12 sm:py-20 px-4 md:px-16 max-w-[1440px] mx-auto text-center border-b border-slate-200 dark:border-slate-800">
    <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">Real Estate Solutions</span>
    <h1 class="font-display text-3xl sm:text-6xl font-light mb-4">Our Lifecycle Services</h1>
    <p class="font-body text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-xl mx-auto">
      End-to-end plot layout sales, turnkey civil construction, JV partnerships, and legal title management in Vadapalani & Chennai.
    </p>
  </section>

  <!-- DYNAMIC SERVICES GRID -->
  <main class="py-12 sm:py-16 px-4 md:px-16 max-w-[1440px] mx-auto flex-grow">
    <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
      <!-- Dynamically populated from Live Admin/Firestore Data -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderPublicServices();

      window.addEventListener('triangle_data_updated', () => {
        renderPublicServices();
      });
      window.addEventListener('storage', (e) => {
        if (e.key === 'triangle_custom_data') {
          renderPublicServices();
        }
      });
    });

    function renderPublicServices() {
      const container = document.getElementById('services-grid');
      if (!container) return;

      const liveData = window.loadLiveTriangleData ? window.loadLiveTriangleData() : {};
      const servicesList = (liveData.services && liveData.services.length > 0) 
        ? liveData.services 
        : (window.BASE_TRIANGLE_DATA ? window.BASE_TRIANGLE_DATA.services : []);

      if (!servicesList || servicesList.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 text-sm col-span-2 py-12">No services registered yet.</p>`;
        return;
      }

      container.innerHTML = servicesList.map(s => `
        <div class="glass-card p-6 sm:p-10 card-hover-lift flex flex-col justify-between border border-slate-200 dark:border-slate-800 shadow-md">
          <div>
            <span class="material-symbols-outlined text-3xl sm:text-4xl text-amber-500 mb-4 inline-block">${s.icon || 'star'}</span>
            <h2 class="font-display text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mb-3">${s.title}</h2>
            <p class="font-body text-slate-600 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">
              ${s.shortDesc || s.fullDesc || ''}
            </p>
            ${s.fullDesc && s.fullDesc !== s.shortDesc ? `
              <p class="font-body text-slate-500 dark:text-slate-400 text-xs leading-relaxed border-t border-slate-100 dark:border-slate-800/80 pt-3 mt-3">
                ${s.fullDesc}
              </p>
            ` : ''}
          </div>

          <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <a href="contact.html?subject=${encodeURIComponent('Inquiry regarding service: ' + s.title)}" 
               class="font-button text-xs font-bold text-amber-500 hover:text-amber-600 uppercase tracking-widest flex items-center gap-1">
              <span>Book Consultation</span>
              <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </a>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
