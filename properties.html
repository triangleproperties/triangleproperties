<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ongoing Projects & Plot Layout Listings | Triangle Properties</title>
  <meta name="description" content="Browse ongoing DTCP & RERA approved projects including Susee Alight Kuthambakkam, M.A. Nagar Kadambathur, and Ishwarya Nagar ECR with EMI options." />
  <link rel="canonical" href="https://triangleproperties.in/properties.html" />
  <meta property="og:title" content="Ongoing Projects & Plot Layout Listings | Triangle Properties" />
  <meta property="og:description" content="Explore approved plots with EMI options starting at ₹6,000/month." />
  <meta property="og:url" content="https://triangleproperties.in/properties.html" />
  <meta property="og:image" content="https://triangleproperties.in/assets/logo.png" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC NAVBAR CONTAINER (Loaded from components/navbar.html) -->
  <div id="navbar-container"></div>
  <script src="js/navbar-loader.js"></script>

  <!-- BANNER -->
  <section id="collections" class="py-12 sm:py-20 px-4 md:px-16 max-w-[1440px] mx-auto text-center border-b border-slate-200 dark:border-slate-800">
    <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">100% Legal Clear Plotted Developments</span>
    <h1 class="font-display text-3xl sm:text-6xl font-light mb-4">ONGOING PROJECTS</h1>
    <p class="font-body text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-2xl mx-auto leading-relaxed">
      From affordable residential plots to premium gated communities, our ongoing projects are designed to deliver exceptional value and long-term appreciation.
    </p>
  </section>

  <!-- SEARCH TOOLBAR -->
  <section class="py-4 sm:py-6 px-4 md:px-16 max-w-[1440px] mx-auto sticky top-16 sm:top-20 z-30 glass-nav border-b border-slate-200 dark:border-slate-800">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 items-center">
      <div class="lg:col-span-2 relative">
        <input type="text" id="search-keyword" placeholder="Search location (Vadapalani, ECR, Tambaram...)" 
               class="w-full pl-10 pr-4 py-2.5 sm:py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-xs sm:text-sm focus:outline-none focus:border-amber-500">
        <span class="material-symbols-outlined absolute left-3 top-2.5 sm:top-3 text-slate-400 text-base">search</span>
      </div>

      <div>
        <select id="filter-type" class="w-full px-3 py-2.5 sm:py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-xs sm:text-sm font-button uppercase">
          <option value="ALL">All Categories</option>
          <option value="CMDA Approved Plot">CMDA Approved Plots</option>
          <option value="DTCP Approved Plot">DTCP Approved Plots</option>
          <option value="Gated Villa Plot">Gated Villa Plots</option>
          <option value="Commercial Land">Commercial Land</option>
          <option value="Farm & Agricultural Land">Farm & Agricultural Lands</option>
        </select>
      </div>

      <div>
        <select id="filter-status" class="w-full px-3 py-2.5 sm:py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-xs sm:text-sm font-button uppercase">
          <option value="ALL">All Project Statuses</option>
          <option value="Completed Projects">Completed Projects</option>
          <option value="Startup Projects">Startup Projects</option>
          <option value="For Sale">For Sale</option>
        </select>
      </div>

      <div>
        <select id="filter-price" class="w-full px-3 py-2.5 sm:py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-xs sm:text-sm font-button uppercase">
          <option value="9999999999">Max Price: Any</option>
          <option value="5000000">Up to ₹ 50 Lakhs</option>
          <option value="10000000">Up to ₹ 1.0 Cr</option>
          <option value="20000000">Up to ₹ 2.0 Cr</option>
          <option value="40000000">Up to ₹ 4.0 Cr</option>
        </select>
      </div>
    </div>
  </section>

  <!-- GRID -->
  <main class="py-12 sm:py-16 px-4 md:px-16 max-w-[1440px] mx-auto flex-grow">
    <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/properties.js"></script>
</body>
</html>
