<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Article Detail | Triangle Properties Blog</title>
  <meta name="description" content="Read full article on Chennai real estate, CMDA & DTCP layout legal checks, and turnkey civil construction guidance."/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC NAVBAR CONTAINER -->
  <div id="navbar-container"></div>
  <script src="js/navbar-loader.js"></script>

  <!-- ARTICLE MAIN CONTENT -->
  <main class="py-12 sm:py-16 px-4 md:px-16 max-w-4xl mx-auto flex-grow w-full">
    <div id="blog-detail-container">
      <!-- Loaded dynamically via JavaScript -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderBlogDetail();
    });

    function renderBlogDetail() {
      const container = document.getElementById('blog-detail-container');
      if (!container) return;

      const urlParams = new URLSearchParams(window.location.search);
      const blogId = urlParams.get('id') || 'blog-1';

      const liveData = window.loadLiveTriangleData ? window.loadLiveTriangleData() : window.TRIANGLE_DATA;
      const blogs = liveData?.blogs || [];
      const article = blogs.find(b => b.id === blogId) || blogs[0];

      if (!article) {
        container.innerHTML = `
          <div class="text-center py-20">
            <h2 class="text-2xl font-bold font-display mb-4">Article Not Found</h2>
            <a href="blog.html" class="btn-primary text-xs uppercase tracking-widest px-6 py-3 inline-block">Back to All Articles</a>
          </div>
        `;
        return;
      }

      document.title = `${article.title} | Triangle Properties Blog`;

      container.innerHTML = `
        <div class="mb-6">
          <a href="blog.html" class="inline-flex items-center gap-1 font-button text-xs uppercase tracking-widest text-amber-500 hover:underline mb-6 font-bold">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Blog
          </a>
          <span class="px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/10 text-amber-500 border border-amber-500/30 inline-block mb-4">
            ${article.category}
          </span>
          <h1 class="font-display text-3xl sm:text-5xl font-bold leading-tight mb-4 text-slate-900 dark:text-white">
            ${article.title}
          </h1>
          <div class="flex items-center gap-4 text-xs text-slate-500 dark:text-slate-400 font-button pb-6 border-b border-slate-200 dark:border-slate-800">
            <span>By ${article.author}</span>
            <span>•</span>
            <span>${article.date}</span>
            <span>•</span>
            <span>${article.readTime}</span>
          </div>
        </div>

        <div class="aspect-[16/9] rounded-3xl overflow-hidden mb-8 shadow-xl border border-slate-200 dark:border-slate-800 bg-slate-900">
          <img src="${article.image}" alt="${article.title}" class="w-full h-full object-cover">
        </div>

        <div class="prose dark:prose-invert max-w-none font-body text-slate-700 dark:text-slate-300 text-sm leading-relaxed mb-12">
          ${article.content}
        </div>

        <div class="p-8 glass-card rounded-3xl border border-amber-500/30 bg-amber-500/5 text-center my-12">
          <h3 class="font-display text-2xl font-bold mb-2">Looking for Verified Properties in Chennai?</h3>
          <p class="text-xs text-slate-600 dark:text-slate-300 max-w-md mx-auto mb-6">
            Browse CMDA & DTCP approved plots with 100% legal title clearance and flexible monthly EMI payment terms.
          </p>
          <a href="properties.html" class="btn-primary text-xs uppercase tracking-widest px-8 py-3 inline-block font-bold">
            Explore All Projects
          </a>
        </div>
      `;
    }
  </script>
</body>
</html>
