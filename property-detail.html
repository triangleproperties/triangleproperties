<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details | Triangle Properties</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
            blue: { 600: '#2563eb', 700: '#1d4ed8' },
            slate: { 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

  <!-- NAVBAR -->
  <header id="navbar" class="fixed top-0 left-0 right-0 z-40 glass-nav transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center shadow-lg">
            <svg class="w-6 h-6 text-slate-950 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0v-8a2 2 0 012-2h2a2 2 0 012 2v8" />
            </svg>
          </div>
          <div>
            <span class="text-xl font-black tracking-tight text-slate-900 dark:text-white font-heading block leading-none">
              TRIANGLE <span class="text-amber-500">PROPERTIES</span>
            </span>
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500 dark:text-slate-400 block mt-0.5">Property Details</span>
          </div>
        </a>

        <nav class="hidden lg:flex items-center gap-7">
          <a href="index.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">Home</a>
          <a href="about.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">About Us</a>
          <a href="services.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">Services</a>
          <a href="properties.html" class="nav-link text-sm font-bold text-amber-500">Properties</a>
          <a href="construction.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">Construction</a>
          <a href="joint-venture.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">Joint Venture</a>
          <a href="gallery.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">Gallery</a>
          <a href="contact.html" class="nav-link text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-amber-500">Contact</a>
        </nav>

        <div class="flex items-center gap-3">
          <button type="button" class="theme-toggle-btn p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
            <svg class="icon-sun w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
          </button>
          <a href="contact.html" class="hidden sm:inline-flex px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm">Book Visit</a>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="property-detail-container" class="pt-28 pb-16 flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
    <!-- Populated by inline script below -->
  </main>

  <footer class="bg-slate-950 text-slate-400 pt-12 pb-8 border-t border-slate-900 mt-auto text-center text-xs">
    <p>© 2026 Triangle Properties & Constructions. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const propId = urlParams.get('id') || 'prop-101';
      const prop = window.TRIANGLE_DATA?.properties.find(p => p.id === propId) || window.TRIANGLE_DATA?.properties[0];
      
      const container = document.getElementById('property-detail-container');
      if (!prop || !container) return;

      document.title = `${prop.title} | Triangle Properties`;

      container.innerHTML = `
        <div class="space-y-8">
          <!-- Back Link -->
          <a href="properties.html" class="inline-flex items-center gap-2 text-xs font-bold text-amber-500 hover:underline">
            &larr; Back to Properties List
          </a>

          <!-- Main Header -->
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <span class="px-3 py-1 rounded-full text-xs font-bold uppercase bg-amber-500 text-slate-950 inline-block mb-2">
                ${prop.status} • ${prop.category}
              </span>
              <h1 class="text-3xl md:text-4xl font-black font-heading">${prop.title}</h1>
              <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">${prop.address}</p>
            </div>
            <p class="text-3xl font-black text-amber-500 font-heading">${prop.price}</p>
          </div>

          <!-- Hero Image & Thumbnails -->
          <div class="glass-card rounded-3xl overflow-hidden p-4">
            <img id="detail-main-img" src="${prop.image}" alt="${prop.title}" class="w-full h-[450px] object-cover rounded-2xl mb-4" />
            
            ${prop.gallery && prop.gallery.length > 1 ? `
              <div class="flex gap-3 overflow-x-auto pb-2">
                ${prop.gallery.map(img => `
                  <img src="${img}" onclick="document.getElementById('detail-main-img').src='${img}'" 
                       class="w-28 h-20 object-cover rounded-xl cursor-pointer hover:opacity-80 border-2 border-transparent hover:border-amber-500 transition-all flex-shrink-0" />
                `).join('')}
              </div>
            ` : ''}
          </div>

          <!-- Specs & Content Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
              <!-- Key Specs -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-md">
                <div>
                  <span class="text-xs text-slate-400 block font-medium">Bedrooms</span>
                  <span class="text-lg font-bold">${prop.bedrooms > 0 ? prop.bedrooms + ' BHK' : 'N/A'}</span>
                </div>
                <div>
                  <span class="text-xs text-slate-400 block font-medium">Bathrooms</span>
                  <span class="text-lg font-bold">${prop.bathrooms > 0 ? prop.bathrooms : 'N/A'}</span>
                </div>
                <div>
                  <span class="text-xs text-slate-400 block font-medium">Built-Up Area</span>
                  <span class="text-lg font-bold">${prop.areaSqft} sqft</span>
                </div>
                <div>
                  <span class="text-xs text-slate-400 block font-medium">Approval</span>
                  <span class="text-lg font-bold text-amber-500">${prop.specs?.approval || 'CMDA/DTCP'}</span>
                </div>
              </div>

              <!-- Overview Description -->
              <div class="glass-card p-8 rounded-3xl">
                <h3 class="text-xl font-bold font-heading mb-4">Property Description</h3>
                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${prop.description}</p>
              </div>

              <!-- Amenities -->
              ${prop.amenities && prop.amenities.length > 0 ? `
                <div class="glass-card p-8 rounded-3xl">
                  <h3 class="text-xl font-bold font-heading mb-6">Amenities & Infrastructure</h3>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${prop.amenities.map(item => `
                      <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold">
                        <svg class="w-5 h-5 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>${item}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Inquiry Sidebar -->
            <div>
              <div class="glass-card p-6 rounded-3xl sticky top-28 bg-slate-900 text-white border border-slate-800 shadow-2xl">
                <h3 class="text-xl font-bold font-heading mb-2">Schedule Site Visit</h3>
                <p class="text-xs text-slate-400 mb-6">Interested in this property? Submit your phone number and our representative will arrange an exclusive guided tour.</p>
                
                <form class="triangle-inquiry-form space-y-4">
                  <input type="hidden" name="propertyType" value="Property Inquiry: ${prop.title} (${prop.id})">
                  <div>
                    <input type="text" name="name" required placeholder="Full Name *" 
                           class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500">
                  </div>
                  <div>
                    <input type="tel" name="phone" required placeholder="Phone Number *" 
                           class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500">
                  </div>
                  <div>
                    <textarea name="message" rows="3" placeholder="Preferred date / questions..." 
                              class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                  </div>
                  <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm rounded-xl shadow-lg">
                    Book Instant Visit
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
