<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Architectural Gallery | Triangle Properties</title>
  <meta name="description" content="Explore high-resolution photographs of Triangle Properties completed developments, elevation concepts, structural construction progress, and luxury interiors in Vadapalani & Chennai."/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC COMPONENTS CONTAINERS -->
  <div id="navbar-container"></div>

  <!-- BANNER -->
  <section class="py-12 sm:py-20 px-4 md:px-16 max-w-[1440px] mx-auto text-center border-b border-slate-200 dark:border-slate-800">
    <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">Relive our moments with us</span>
    <h1 class="font-display text-3xl sm:text-5xl font-light mb-4">A Glimpse Into Our Journey, Where Every Frame Reflects Trust</h1>
    <p class="font-body text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-2xl mx-auto leading-relaxed">
      Browse our gallery to discover project launches, site developments, customer milestones, and the moments that reflect our commitment to building trusted communities.
    </p>
  </section>

  <!-- GALLERY PHOTO GRID -->
  <main class="py-12 sm:py-16 px-4 md:px-16 max-w-[1440px] mx-auto flex-grow">
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- Populated via JavaScript -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderGallery();

      // Listen for Live Admin Storage Updates & Cloud Firestore Updates across devices
      window.addEventListener('storage', (e) => {
        if (e.key === 'triangle_custom_data') {
          renderGallery();
        }
      });
      window.addEventListener('triangle_data_updated', () => {
        renderGallery();
      });
    });

    async function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      if (!grid) return;

      let items = [];

      if (window.db) {
        try {
          const { collection, getDocs, query, orderBy } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const snap = await getDocs(collection(window.db, "gallery"));
          if (snap.docs.length > 0) {
            items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          }
        } catch (e) {
          console.warn("Firestore public gallery read notice:", e);
        }
      }

      if (!items || items.length === 0) {
        const liveData = window.loadLiveTriangleData ? window.loadLiveTriangleData() : window.TRIANGLE_DATA;
        items = liveData?.gallery || [];
      }

      grid.innerHTML = items.map(item => `
        <div class="glass-card rounded-2xl overflow-hidden group border border-slate-200 dark:border-slate-800 shadow-lg hover:-translate-y-1 transition-all duration-300">
          <div class="aspect-[4/3] overflow-hidden relative bg-slate-900">
            <img src="${item.image}" alt="${item.title || 'Triangle Gallery'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy">
          </div>
          <div class="p-4 sm:p-5">
            <h3 class="font-display text-lg sm:text-xl font-bold text-slate-900 dark:text-white line-clamp-1">${item.title || 'Triangle Project Photo'}</h3>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
