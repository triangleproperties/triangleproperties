<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Details | Triangle Properties</title>
  <meta name="description" id="meta-description"
    content="View detailed specifications, approved plot dimensions, and pricing for this premium listing by Triangle Properties Chennai." />
  <link rel="canonical" id="canonical-link" href="https://triangleproperties.in/property-detail.html" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- OPENGRAPH SOCIAL MEDIA META TAGS -->
  <meta property="og:site_name" content="Triangle Properties" />
  <meta property="og:type" content="website" />
  <meta property="og:title" id="og-title" content="Property Details | Triangle Properties" />
  <meta property="og:description" id="og-desc" content="View specifications, location, and pricing by Triangle Properties." />
  <meta property="og:url" id="og-url" content="https://triangleproperties.in/property-detail.html" />
  <meta property="og:image" id="og-image" content="https://triangleproperties.in/assets/logo.png" />
  <meta property="og:locale" content="en_IN" />

  <!-- TWITTER CARD META TAGS -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="Property Details | Triangle Properties" />
  <meta name="twitter:description" id="twitter-desc" content="DTCP & RERA approved plots in Chennai by Triangle Properties." />
  <meta name="twitter:image" id="twitter-image" content="https://triangleproperties.in/assets/logo.png" />

  <!-- DYNAMIC JSON-LD CONTAINER -->
  <script type="application/ld+json" id="property-schema-jsonld"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC NAVBAR CONTAINER (Loaded from components/navbar.html) -->
  <div id="navbar-container"></div>
  <script src="js/navbar-loader.js"></script>

  <!-- PROPERTY DETAIL CONTAINER -->
  <main id="property-detail-container" class="py-12 sm:py-16 px-4 md:px-16 max-w-[1440px] mx-auto flex-grow">
    <!-- Dynamically populated by JS from query param id (e.g. ?id=prop-101) -->
    <div class="text-center py-20">
      <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-2">Loading Property
        Details</span>
      <p class="font-body text-slate-500 text-sm">Please wait while we load the listing specifications...</p>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/properties.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const propId = urlParams.get('id') || 'prop-101';
      renderPropertyDetail(propId);
    });

    function renderPropertyDetail(id) {
      const container = document.getElementById('property-detail-container');
      if (!container || !window.TRIANGLE_DATA) return;

      const prop = window.TRIANGLE_DATA.properties.find(p => p.id === id) || window.TRIANGLE_DATA.properties[0];

      // Dynamic SEO Meta & Social Tags
      const pageTitle = `${prop.title} | Triangle Properties Chennai`;
      const pageDesc = `${prop.title} in ${prop.location}. ${prop.category} priced at ${prop.price}. ${prop.description ? prop.description.substring(0, 150) : ''}...`;
      const pageUrl = `https://triangleproperties.in/property-detail.html?id=${encodeURIComponent(prop.id)}`;

      document.title = pageTitle;
      const metaDescEl = document.getElementById('meta-description');
      if (metaDescEl) metaDescEl.setAttribute('content', pageDesc);

      const canonicalEl = document.getElementById('canonical-link');
      if (canonicalEl) canonicalEl.setAttribute('href', pageUrl);

      const ogTitleEl = document.getElementById('og-title');
      if (ogTitleEl) ogTitleEl.setAttribute('content', pageTitle);
      const ogDescEl = document.getElementById('og-desc');
      if (ogDescEl) ogDescEl.setAttribute('content', pageDesc);
      const ogUrlEl = document.getElementById('og-url');
      if (ogUrlEl) ogUrlEl.setAttribute('content', pageUrl);
      const ogImgEl = document.getElementById('og-image');
      if (ogImgEl && prop.image) ogImgEl.setAttribute('content', prop.image);

      const twTitleEl = document.getElementById('twitter-title');
      if (twTitleEl) twTitleEl.setAttribute('content', pageTitle);
      const twDescEl = document.getElementById('twitter-desc');
      if (twDescEl) twDescEl.setAttribute('content', pageDesc);
      const twImgEl = document.getElementById('twitter-image');
      if (twImgEl && prop.image) twImgEl.setAttribute('content', prop.image);

      // Dynamic RealEstateListing / Product JSON-LD Schema
      const schemaEl = document.getElementById('property-schema-jsonld');
      if (schemaEl) {
        schemaEl.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Product",
          "name": prop.title,
          "image": prop.image,
          "description": prop.description || pageDesc,
          "category": prop.category,
          "offers": {
            "@type": "Offer",
            "price": prop.price,
            "priceCurrency": "INR",
            "availability": "https://schema.org/InStock",
            "seller": {
              "@type": "RealEstateAgent",
              "name": "Triangle Properties",
              "telephone": "+91-8838957874",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "No.23, Pillaiyar Kovil Street, Vadapalani",
                "addressLocality": "Chennai",
                "postalCode": "600026",
                "addressCountry": "IN"
              }
            }
          }
        }, null, 2);
      }

      container.innerHTML = `
        <div class="space-y-8 sm:space-y-12">
          <!-- Back Link & Title -->
          <div>
            <a href="properties.html" class="inline-flex items-center gap-2 text-amber-500 font-button text-xs uppercase tracking-widest mb-4 hover:underline">
              <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Properties
            </a>
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <span class="font-button text-xs text-amber-500 uppercase tracking-widest block mb-1">${prop.category} • ${prop.location}</span>
                <h1 class="font-display text-3xl sm:text-6xl font-light">${prop.title}</h1>
                <p class="font-body text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-2">${prop.address}</p>
              </div>
              <div class="text-left md:text-right">
                <span class="font-display text-3xl sm:text-4xl text-amber-500 font-bold block">${prop.price}</span>
                <span class="font-button text-xs uppercase text-slate-400">CMDA / DTCP Approved</span>
              </div>
            </div>
          </div>

          <!-- Main Gallery Showcase -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
            <div class="md:col-span-2 aspect-[16/10] rounded-2xl overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800">
              <img id="main-detail-img" src="${prop.image}" alt="${prop.title}" class="w-full h-full object-cover">
            </div>
            <div class="grid grid-cols-2 md:grid-cols-1 gap-3 sm:gap-4">
              ${(prop.gallery || [prop.image]).map(img => `
                <div class="aspect-[16/9] rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 cursor-pointer hover:opacity-80 transition-opacity" onclick="document.getElementById('main-detail-img').src='${img}'">
                  <img src="${img}" alt="Gallery thumbnail" class="w-full h-full object-cover">
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Specifications Bar -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 p-6 sm:p-8 rounded-2xl glass-card text-center">
            <div>
              <span class="font-button text-xs uppercase text-slate-400 block mb-1">Bedrooms</span>
              <span class="font-display text-xl sm:text-2xl font-bold text-amber-500">${prop.bedrooms || 'N/A'} BHK</span>
            </div>
            <div>
              <span class="font-button text-xs uppercase text-slate-400 block mb-1">Bathrooms</span>
              <span class="font-display text-xl sm:text-2xl font-bold text-amber-500">${prop.bathrooms || 'N/A'} Baths</span>
            </div>
            <div>
              <span class="font-button text-xs uppercase text-slate-400 block mb-1">Built-up Area</span>
              <span class="font-display text-xl sm:text-2xl font-bold text-amber-500">${prop.areaSqft} Sq. Ft.</span>
            </div>
            <div>
              <span class="font-button text-xs uppercase text-slate-400 block mb-1">Parking</span>
              <span class="font-display text-xl sm:text-2xl font-bold text-amber-500">${prop.parking || 'Reserved'}</span>
            </div>
          </div>

          <!-- Description & Inquiry CTA -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 sm:gap-12">
            <div class="lg:col-span-2 space-y-6 sm:space-y-8">
              <div>
                <h2 class="font-display text-2xl sm:text-3xl font-light mb-3 sm:mb-4">Property Description</h2>
                <p class="font-body text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${prop.description}</p>
              </div>

              <div>
                <h2 class="font-display text-2xl sm:text-3xl font-light mb-3 sm:mb-4">Luxury Amenities</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
                  ${(prop.amenities || ['Covered Parking', 'Vastu Compliant', 'Power Backup', 'CCTV Security', 'Elevator Access']).map(am => `
                    <div class="flex items-center gap-2 p-3 sm:p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-button uppercase">
                      <span class="material-symbols-outlined text-amber-500 text-base">check_circle</span>
                      <span>${am}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Sticky Right Inquiry Form -->
            <div class="glass-card p-6 sm:p-8 rounded-2xl h-fit sticky top-24">
              <h3 class="font-display text-xl sm:text-2xl mb-2">Interested in this property?</h3>
              <p class="font-body text-xs text-slate-400 mb-6">Schedule a site visit with our Vadapalani relationship advisor.</p>

              <form class="triangle-inquiry-form space-y-4">
                <input type="hidden" name="propertyType" value="${prop.title}">
                  <div>
                    <input type="text" name="name" required placeholder="Your Name *"
                      class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-sm focus:outline-none focus:border-amber-500">
                  </div>
                  <div>
                    <input type="tel" name="phone" required placeholder="Mobile Number *"
                      class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-sm focus:outline-none focus:border-amber-500">
                  </div>
                  <div>
                    <textarea name="message" rows="3" placeholder="I would like to book a site visit for ${prop.title}..."
                      class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-sm focus:outline-none focus:border-amber-500"></textarea>
                  </div>
                  <button type="submit" class="w-full btn-primary text-xs uppercase tracking-widest">
                    Request Site Visit
                  </button>
              </form>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>

</html>
