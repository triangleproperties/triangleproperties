<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('triangle_theme') || localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real Estate Article | Triangle Properties Blog</title>
  <meta name="description" id="meta-description" content="Read full article on Chennai real estate, CMDA & DTCP layout legal checks, and turnkey civil construction guidance."/>
  <link rel="canonical" id="canonical-link" href="https://triangleproperties.in/blog-detail.html" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- OPENGRAPH SOCIAL MEDIA META TAGS -->
  <meta property="og:site_name" content="Triangle Properties" />
  <meta property="og:type" content="article" />
  <meta property="og:title" id="og-title" content="Real Estate Article | Triangle Properties Blog" />
  <meta property="og:description" id="og-desc" content="Expert real estate advice, DTCP approval checks, and plot investments in Chennai." />
  <meta property="og:url" id="og-url" content="https://triangleproperties.in/blog-detail.html" />
  <meta property="og:image" id="og-image" content="https://triangleproperties.in/assets/logo.png" />
  <meta property="og:locale" content="en_IN" />

  <!-- TWITTER CARD META TAGS -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="Real Estate Article | Triangle Properties Blog" />
  <meta name="twitter:description" id="twitter-desc" content="Insights on Chennai plotted developments and civil construction." />
  <meta name="twitter:image" id="twitter-image" content="https://triangleproperties.in/assets/logo.png" />

  <!-- DYNAMIC JSON-LD ARTICLE SCHEMA -->
  <script type="application/ld+json" id="article-schema-jsonld"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "var(--color-surface)",
            "on-surface": "var(--color-on-surface)",
            "on-surface-variant": "var(--color-on-surface-variant)",
            primary: "var(--color-primary)",
            secondary: "var(--color-secondary)"
          },
          fontFamily: {
            display: ["'Cormorant Garamond'", "serif"],
            body: ["Inter", "sans-serif"],
            button: ["Poppins", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-x-hidden">

  <!-- DYNAMIC NAVBAR CONTAINER -->
  <div id="navbar-container"></div>
  <script src="js/navbar-loader.js"></script>

  <!-- ARTICLE MAIN CONTENT -->
  <main class="py-12 sm:py-16 px-4 md:px-16 max-w-4xl mx-auto flex-grow w-full">
    <div id="blog-detail-container">
      <!-- Loaded dynamically via JavaScript -->
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="floating-contact-container"></div>

  <script src="js/data.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderBlogDetail();
      window.addEventListener('firebase-ready', () => renderBlogDetail());
    });

    async function renderBlogDetail() {
      const container = document.getElementById('blog-detail-container');
      if (!container) return;

      const urlParams = new URLSearchParams(window.location.search);
      const blogId = urlParams.get('id') || 'blog-1';

      let article = null;

      if (window.db) {
        try {
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          const snap = await getDoc(doc(window.db, "blogPosts", blogId));
          if (snap.exists()) {
            const data = snap.data();
            // Draft protection: Draft posts must not render publicly
            if ((data.status || 'Published') === 'Published') {
              article = { id: snap.id, ...data };
            }
          }
        } catch (err) {
          console.warn("Firestore public blog detail read notice (falling back):", err);
        }
      }

      if (!article) {
        const liveData = window.loadLiveTriangleData ? window.loadLiveTriangleData() : window.TRIANGLE_DATA;
        const blogs = (liveData?.blogs || []).filter(b => (b.status || 'Published') === 'Published');
        article = blogs.find(b => b.id === blogId) || (blogs[0] && (blogs[0].id === blogId ? blogs[0] : null));
      }

      if (!article) {
        container.innerHTML = `
          <div class="text-center py-20 glass-card rounded-3xl p-8 border border-slate-800">
            <h2 class="text-2xl font-bold font-display mb-4 text-white">Article Not Found</h2>
            <p class="text-xs text-slate-400 mb-6">This article may be unpublished or does not exist.</p>
            <a href="blog.html" class="btn-primary text-xs uppercase tracking-widest px-6 py-3 inline-block">Back to All Articles</a>
          </div>
        `;
        return;
      }

      const title = article.title || '';
      const category = article.category || 'Real Estate';
      const image = article.image || article.coverImage || 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80';
      const date = article.date || (article.createdAt?.toDate ? article.createdAt.toDate().toLocaleDateString() : 'Recent');
      const readTime = article.readTime || '3 min read';
      const author = article.author || 'Triangle Properties Team';
      const contentText = article.content || article.body || article.excerpt || '';

      const articleUrl = `https://triangleproperties.in/blog-detail.html?id=${encodeURIComponent(article.id || '')}`;
      const articleDesc = (article.excerpt || contentText.substring(0, 160) || title).replace(/\s+/g, ' ').trim();

      document.title = `${title} | Triangle Properties Blog`;
      const metaDescEl = document.getElementById('meta-description');
      if (metaDescEl) metaDescEl.setAttribute('content', articleDesc);

      const canonicalEl = document.getElementById('canonical-link');
      if (canonicalEl) canonicalEl.setAttribute('href', articleUrl);

      const ogTitleEl = document.getElementById('og-title');
      if (ogTitleEl) ogTitleEl.setAttribute('content', `${title} | Triangle Properties Blog`);
      const ogDescEl = document.getElementById('og-desc');
      if (ogDescEl) ogDescEl.setAttribute('content', articleDesc);
      const ogUrlEl = document.getElementById('og-url');
      if (ogUrlEl) ogUrlEl.setAttribute('content', articleUrl);
      const ogImgEl = document.getElementById('og-image');
      if (ogImgEl && image) ogImgEl.setAttribute('content', image);

      const twTitleEl = document.getElementById('twitter-title');
      if (twTitleEl) twTitleEl.setAttribute('content', title);
      const twDescEl = document.getElementById('twitter-desc');
      if (twDescEl) twDescEl.setAttribute('content', articleDesc);
      const twImgEl = document.getElementById('twitter-image');
      if (twImgEl && image) twImgEl.setAttribute('content', image);

      // Dynamic BlogPosting JSON-LD Schema
      const schemaEl = document.getElementById('article-schema-jsonld');
      if (schemaEl) {
        schemaEl.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "headline": title,
          "image": image,
          "description": articleDesc,
          "author": {
            "@type": "Organization",
            "name": author
          },
          "publisher": {
            "@type": "Organization",
            "name": "Triangle Properties",
            "logo": {
              "@type": "ImageObject",
              "url": "https://triangleproperties.in/assets/logo.png"
            }
          },
          "url": articleUrl
        }, null, 2);
      }

      container.innerHTML = `
        <div class="mb-6">
          <a href="blog.html" class="inline-flex items-center gap-1 font-button text-xs uppercase tracking-widest text-amber-500 hover:underline mb-6 font-bold">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Blog
          </a>
          <span class="px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/10 text-amber-500 border border-amber-500/30 inline-block mb-4">
            ${category}
          </span>
          <h1 class="font-display text-3xl sm:text-5xl font-bold leading-tight mb-4 text-slate-900 dark:text-white">
            ${title}
          </h1>
          <div class="flex items-center gap-4 text-xs text-slate-500 dark:text-slate-400 font-button pb-6 border-b border-slate-200 dark:border-slate-800">
            <span>By ${author}</span>
            <span>•</span>
            <span>${date}</span>
            <span>•</span>
            <span>${readTime}</span>
          </div>
        </div>

        <div class="aspect-[16/9] rounded-3xl overflow-hidden mb-8 shadow-xl border border-slate-200 dark:border-slate-800 bg-slate-900">
          <img src="${image}" alt="${title}" class="w-full h-full object-cover">
        </div>

        <div id="blog-body-text" class="prose dark:prose-invert max-w-none font-body text-slate-700 dark:text-slate-300 text-sm leading-relaxed mb-12 whitespace-pre-wrap"></div>

        <div class="p-8 glass-card rounded-3xl border border-amber-500/30 bg-amber-500/5 text-center my-12">
          <h3 class="font-display text-2xl font-bold mb-2">Looking for Verified Properties in Chennai?</h3>
          <p class="text-xs text-slate-600 dark:text-slate-300 max-w-md mx-auto mb-6">
            Browse CMDA & DTCP approved plots with 100% legal title clearance and flexible monthly EMI payment terms.
          </p>
          <a href="properties.html" class="btn-primary text-xs uppercase tracking-widest px-8 py-3 inline-block font-bold">
            Explore All Projects
          </a>
        </div>
      `;

      // Safe body rendering: set plain text with pre-wrap to avoid HTML injection
      const bodyEl = document.getElementById('blog-body-text');
      if (bodyEl) bodyEl.textContent = contentText;
    }
  </script>
</body>
</html>
